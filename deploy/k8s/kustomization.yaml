apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: store-crm
resources:
  - namespace.yaml
  - mariadb.yaml
  - app.yaml
  - middlewares.yaml
  - ingress.yaml
images:
  - name: store-crm
    newName: DOCKERHUB_USER/store-crm # Docker Hub 아이디로 바꾼다 (ADR-037)
    newTag: latest # 젠킨스가 커밋 해시로 바꾼다
