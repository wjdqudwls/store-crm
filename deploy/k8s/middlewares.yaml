# Traefik 미들웨어 (k3s 기본 Ingress). 이름은 ingress.yaml의 annotation이 가리킨다.
# 접근 제한은 앱의 로그인(JWT, B0-3)이 한다. basicAuth는 앱의 `Authorization: Bearer`와 같은 헤더라 쓰지 않는다.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: no-cache
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "no-cache"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: immutable-cache
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=31536000, immutable"
