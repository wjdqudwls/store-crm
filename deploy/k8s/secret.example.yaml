# 예시일 뿐이다. kustomization.yaml에 넣지 않았고, 실제 값은 레포에 올리지 않는다 (NFR-06).
# VM에서 .env 파일로 만든다:
#   kubectl -n store-crm create secret generic app-env --from-env-file=.env
#   kubectl -n store-crm create secret generic basic-auth --from-file=users=./htpasswd
# .env에 들어갈 키 이름(값은 VM에서 직접 적는다):
#   DB_PASSWORD, DB_ROOT_PASSWORD, JWT_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
apiVersion: v1
kind: Secret
metadata:
  name: app-env
  namespace: store-crm
type: Opaque
stringData:
  DB_PASSWORD: ""
  DB_ROOT_PASSWORD: ""
  JWT_SECRET: ""
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  VAPID_SUBJECT: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: store-crm
type: Opaque
stringData:
  users: "" # htpasswd -nbB 사용자 비밀번호 한 줄
