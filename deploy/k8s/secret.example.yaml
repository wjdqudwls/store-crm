# 예시일 뿐이다. kustomization.yaml에 넣지 않았고, 실제 값은 레포에 올리지 않는다 (NFR-06).
# VM에서 .env 파일로 만든다:
#   kubectl -n store-crm create secret generic app-env --from-env-file=.env
# .env에 들어갈 키 이름(값은 VM에서 직접 적는다):
#   DB_PASSWORD, DB_ROOT_PASSWORD, JWT_SECRET, HQ_INITIAL_PASSWORD, STORE_INITIAL_PASSWORD, STAFF_INITIAL_PASSWORD, CRYPTO_KEY, HMAC_KEY, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
# JWT_SECRET은 32바이트 이상: `openssl rand -base64 48`.
# *_INITIAL_PASSWORD(본사·매장·데모 직원 계정 초기 비밀번호)는 8자 이상 영문+숫자. 비었거나 약하면 앱이 시작하지 않는다.
# CRYPTO_KEY·HMAC_KEY(고객 개인정보 암호화)는 각각 `openssl rand -base64 32`로 만든다.
# 한 번 정하면 바꾸지 않는다(바꾸면 저장된 전화번호를 못 읽는다). 값이 없으면 앱이 시작하지 않는다.
# 두 키는 VM 밖 안전한 곳(비밀번호 관리자 등)에 따로 백업해 둔다.
apiVersion: v1
kind: Secret
metadata:
  name: app-env
  namespace: store-crm
type: Opaque
stringData:
  DB_PASSWORD: ""
  DB_ROOT_PASSWORD: ""
  JWT_SECRET: ""
  HQ_INITIAL_PASSWORD: ""
  STORE_INITIAL_PASSWORD: ""
  STAFF_INITIAL_PASSWORD: ""
  CRYPTO_KEY: ""
  HMAC_KEY: ""
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  VAPID_SUBJECT: ""
