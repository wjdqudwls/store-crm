# MariaDB 11 한 개. 로컬 docker-compose.yml과 같은 이미지·문자셋이다 (ADR-033, ADR-037).
# 데이터는 k3s 기본 저장소(local-path)의 PVC에 둔다. 단일 노드라 이 정도로 충분하다.
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  clusterIP: None # 클러스터 안에서만 접속한다. 밖으로 열지 않는다.
  selector:
    app: mariadb
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --innodb-buffer-pool-size=256M
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: TZ
              value: Asia/Seoul
            - name: MARIADB_DATABASE
              value: crm
            - name: MARIADB_USER
              value: crm
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: DB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: DB_ROOT_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
