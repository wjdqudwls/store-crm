<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <!-- CRM pos 시스템 아키텍처. 원본은 이 SVG이고, PNG는 여기서 만든다. 내용은 04-architecture.md를 따른다. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-later" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="990" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">CRM pos 시스템 아키텍처</text>
  <text x="40" y="82" font-size="15" fill="#475569">모듈러 모놀리스 · 웹사이트 1개 · 서버 1개 · DB 1개 (ADR-001) · 판매 → 고객관리는 outbox 이벤트 (ADR-002)</text>

  <!-- 사용자 · 기기 -->
  <text x="40" y="122" font-size="15" font-weight="700" fill="#475569">사용자 · 기기</text>
  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <rect x="40" y="135" width="260" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="170" y="160" font-size="15" font-weight="700" fill="#0f172a">매장 노트북 · 매장폰</text>
    <text x="170" y="181">매장 계정 STORE</text>
    <text x="170" y="200">판매 기록 · 오늘 할 일 · 콜리스트</text>

    <rect x="40" y="227" width="260" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="170" y="252" font-size="15" font-weight="700" fill="#0f172a">직원 폰 웹앱</text>
    <text x="170" y="273">MANAGER · SENIOR · JUNIOR · STAFF</text>
    <text x="170" y="292">내 할 일 · 내 고객 · 메모 · 알림함</text>

    <rect x="40" y="319" width="260" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="170" y="344" font-size="15" font-weight="700" fill="#0f172a">본사 PC · 폰</text>
    <text x="170" y="365">HQ</text>
    <text x="170" y="384">매장 목록 · 직원 관리 · 등급 기준</text>

    <rect x="40" y="411" width="260" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="170" y="436" font-size="15" font-weight="700" fill="#0f172a">매장 iPad</text>
    <text x="170" y="457">KIOSK</text>
    <text x="170" y="476">고객 등록 폼만</text>

    <rect x="40" y="503" width="260" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="170" y="528" font-size="15" font-weight="700" fill="#0f172a">고객 폰 (QR)</text>
    <text x="170" y="549">로그인 없음</text>
    <text x="170" y="568">고객 등록 폼 · IP당 분당 5회</text>
  </g>

  <!-- 사용자 → 서버 -->
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="300" y1="174" x2="358" y2="174"/>
    <line x1="300" y1="266" x2="358" y2="266"/>
    <line x1="300" y1="358" x2="358" y2="358"/>
    <line x1="300" y1="450" x2="358" y2="450"/>
    <line x1="300" y1="542" x2="358" y2="542"/>
  </g>
  <text x="329" y="164" font-size="12" fill="#475569" text-anchor="middle">HTTPS</text>

  <!-- 서버 -->
  <rect x="360" y="120" width="840" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="149" font-size="16" font-weight="700" fill="#0f172a">Spring Boot 4.1 서버 · Java 21</text>

  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <rect x="380" y="165" width="240" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="500" y="190" font-size="14" font-weight="700" fill="#0f172a">Vue 3 화면 (정적 파일)</text>
    <text x="500" y="211">PC·폰 레이아웃 · 토큰만 저장</text>

    <rect x="640" y="165" width="260" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="770" y="190" font-size="14" font-weight="700" fill="#0f172a">REST API /api/v1</text>
    <text x="770" y="211">공통 에러 형식 · traceId · Swagger</text>

    <rect x="920" y="165" width="260" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="1050" y="190" font-size="14" font-weight="700" fill="#0f172a">Spring Security + JWT</text>
    <text x="1050" y="211">역할 7개 · 요청마다 계정 확인</text>
  </g>

  <!-- 모듈 -->
  <g font-size="12.5" fill="#334155" text-anchor="middle">
    <rect x="380" y="255" width="160" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="460" y="282" font-size="16" font-weight="700" fill="#1d4ed8">product</text>
    <text x="460" y="308">상품 · SKU</text>
    <text x="460" y="328">엑셀 폼 · 가져오기</text>
    <text x="460" y="348">api: SKU·정가 조회</text>

    <rect x="640" y="255" width="220" height="150" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="750" y="282" font-size="16" font-weight="700" fill="#c2410c">sales</text>
    <text x="750" y="308">판매 · 반품 · 교환 · 정정</text>
    <text x="750" y="328">하루 마감 · 영수증 번호</text>
    <text x="750" y="348">outbox 기록 · 발행기</text>
    <text x="750" y="368">구매이력 · 판매 내역 제공</text>

    <rect x="960" y="255" width="220" height="150" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="1070" y="282" font-size="16" font-weight="700" fill="#047857">customer</text>
    <text x="1070" y="308">고객 · 가족 · 등급</text>
    <text x="1070" y="328">메모 · 콜리스트 · 후속 연락</text>
    <text x="1070" y="348">이벤트 처리 (중복 방지)</text>
    <text x="1070" y="368">고객 등록 (직원·iPad·QR)</text>
    <text x="1070" y="388">api: 등급·할인율·착용자</text>

    <rect x="380" y="455" width="800" height="70" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="780" y="482" font-size="16" font-weight="700" fill="#6d28d9">common</text>
    <text x="780" y="507">매장 · 계정(직급·키오스크) · 로그인 · 직원 알림함 · QR 이미지 · 공통 타입 · 공통 에러 · 이벤트 형식</text>
  </g>

  <!-- 모듈 사이 화살표 -->
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="640" y1="300" x2="542" y2="300"/>
    <line x1="860" y1="300" x2="958" y2="300"/>
    <line x1="460" y1="405" x2="460" y2="453"/>
    <line x1="750" y1="405" x2="750" y2="453"/>
    <line x1="990" y1="405" x2="990" y2="453"/>
  </g>
  <g stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-event)">
    <line x1="860" y1="352" x2="958" y2="352"/>
    <line x1="1150" y1="455" x2="1150" y2="407"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="591" y="292" fill="#334155">api 읽기</text>
    <text x="591" y="318" fill="#475569">SKU·정가</text>
    <text x="909" y="292" fill="#334155">api 읽기</text>
    <text x="909" y="318" fill="#475569">등급·할인율</text>
    <text x="909" y="344" fill="#ea580c">outbox 이벤트</text>
    <text x="909" y="370" fill="#ea580c">구매·반품 쓰기</text>
    <text x="605" y="434" fill="#475569">모든 모듈 → 공통</text>
    <text x="1070" y="434" fill="#ea580c">퇴사 이관 이벤트</text>
  </g>

  <!-- 스케줄 · 데이터 접근 -->
  <g font-size="12" fill="#475569" text-anchor="middle">
    <rect x="380" y="550" width="390" height="75" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="575" y="573" font-size="14" font-weight="700" fill="#0f172a">스케줄 작업</text>
    <text x="575" y="594">outbox 발행기: 1초마다, 실패하면 10회까지 재시도</text>
    <text x="575" y="613">정기 산정: 6/1 새벽 · 6월 서버 시작 때 · 수동</text>

    <rect x="790" y="550" width="390" height="75" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="985" y="573" font-size="14" font-weight="700" fill="#0f172a">데이터 접근</text>
    <text x="985" y="594">쓰기: JPA 엔티티 · 조회: MyBatis</text>
    <text x="985" y="613">자기 모듈 테이블만 · ArchUnit·SQL 경계 테스트</text>
  </g>

  <!-- 서버 → DB -->
  <line x1="1200" y1="380" x2="1248" y2="380" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1224" y="370" font-size="12" fill="#475569" text-anchor="middle">JDBC</text>

  <!-- DB -->
  <g>
    <path d="M1250,210 L1250,560 A155,22 0 0 0 1560,560 L1560,210" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="1405" cy="210" rx="155" ry="22" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
    <g font-size="13" fill="#334155" text-anchor="middle">
      <text x="1405" y="276" font-size="19" font-weight="700" fill="#0369a1">MariaDB 11</text>
      <text x="1405" y="312">테이블 24개 · 모듈마다 자기 테이블</text>
      <text x="1405" y="338">모듈 간 FK 없음, ID만 (ADR-003)</text>
      <text x="1405" y="364">outbox_event · processed_event</text>
      <text x="1405" y="390">판매 행·채번 행 잠금 (FOR UPDATE)</text>
      <text x="1405" y="416">전화번호·상세주소 암호화</text>
      <text x="1405" y="442">물리 명세는 schema.sql (ADR-031)</text>
    </g>
  </g>

  <!-- 개발 · 테스트 · 배포 -->
  <line x1="40" y1="672" x2="1560" y2="672" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="705" font-size="15" font-weight="700" fill="#475569">개발 · 테스트 · 배포</text>

  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <rect x="40" y="720" width="260" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="170" y="746" font-size="15" font-weight="700" fill="#0f172a">개발 PC</text>
    <text x="170" y="772">docker compose: MariaDB 11</text>
    <text x="170" y="794">./gradlew bootRun (8080)</text>
    <text x="170" y="816">Vite 개발 서버 (/api 프록시)</text>
    <text x="170" y="838">.env는 커밋하지 않음</text>

    <rect x="360" y="720" width="260" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="490" y="746" font-size="15" font-weight="700" fill="#0f172a">GitHub</text>
    <text x="490" y="772">문서: main에 바로 커밋</text>
    <text x="490" y="794">코드: 기능 브랜치 → PR</text>
    <text x="490" y="816">브랜치 이름에 작업 ID</text>
    <text x="490" y="838">PR 설명에 요구사항 ID</text>

    <rect x="680" y="720" width="260" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="810" y="746" font-size="15" font-weight="700" fill="#0f172a">GitHub Actions</text>
    <text x="810" y="772">backend-ci: ./gradlew test</text>
    <text x="810" y="794">PR과 main push마다</text>
    <text x="810" y="816">frontend-ci (F0에서 추가)</text>

    <rect x="1000" y="720" width="260" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <text x="1130" y="746" font-size="15" font-weight="700" fill="#0f172a">무료 호스팅 (확인 예정)</text>
    <text x="1130" y="772">Docker 이미지 1개</text>
    <text x="1130" y="794">Vue 빌드 + Spring Boot jar</text>
    <text x="1130" y="816">서버 + MariaDB, 월 0원</text>
    <text x="1130" y="838">6단계 빈 서버 → 12단계 배포</text>

    <rect x="1320" y="720" width="240" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="1440" y="746" font-size="15" font-weight="700" fill="#0f172a">테스트</text>
    <text x="1440" y="772">JUnit 5 · Mockito · MockMvc</text>
    <text x="1440" y="794">Testcontainers MariaDB</text>
    <text x="1440" y="816">ArchUnit (모듈 경계)</text>
    <text x="1440" y="838">Vitest (화면 계산 함수)</text>
  </g>

  <g stroke-width="1.6">
    <line x1="300" y1="785" x2="358" y2="785" stroke="#334155" marker-end="url(#arrow)"/>
    <line x1="620" y1="785" x2="678" y2="785" stroke="#334155" marker-end="url(#arrow)"/>
    <line x1="940" y1="785" x2="998" y2="785" stroke="#94a3b8" stroke-dasharray="6 4" marker-end="url(#arrow-later)"/>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="329" y="776">push</text>
    <text x="649" y="776">PR</text>
    <text x="969" y="776">배포</text>
  </g>

  <!-- 범례 -->
  <g font-size="12.5" fill="#475569">
    <line x1="40" y1="900" x2="90" y2="900" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="100" y="905">호출 · 읽기</text>
    <line x1="200" y1="900" x2="250" y2="900" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-event)"/>
    <text x="260" y="905">이벤트로 쓰기 (outbox, 같은 트랜잭션 이벤트)</text>
    <line x1="560" y1="900" x2="610" y2="900" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-later)"/>
    <text x="620" y="905">아직 하지 않은 단계</text>
    <text x="40" y="945" font-size="12" fill="#64748b">ADR 번호는 docs/decisions.md · 자세한 설명은 docs/04-architecture.md · 진행 순서는 docs/wbs.md · 2026-10-30 초안 (개발하면서 고친다)</text>
  </g>
</svg>
