# Testcontainers가 DB 주소·계정을 정한다. 이 값은 자리만 채우는 값이다 (실제 비밀번호 아님).
DB_PASSWORD=unused-testcontainers-overrides

# 테스트용 키 (base64, 32바이트). 실제 키가 아니다.
CRYPTO_KEY=dGVzdC1vbmx5LWNyeXB0by1rZXktMzItYnl0ZXMhISE=
HMAC_KEY=dGVzdC1vbmx5LWhtYWMta2V5LTMyLWJ5dGVzLW1vcmU=

# outbox 발행기는 테스트에서 직접 부른다 (스케줄 연결은 켠 테스트 하나로 확인)
crm.outbox.publisher.enabled=false

# 로그인 테스트용 값 (실제 값이 아니다)
JWT_SECRET=test-only-jwt-secret-key-at-least-32-bytes-long!!
HQ_INITIAL_PASSWORD=hqPass1234
STORE_INITIAL_PASSWORD=storePass1234
STAFF_INITIAL_PASSWORD=staffPass1234

# 방문 예약·재연락 알림 스케줄은 테스트에서 직접 부른다
crm.reminders.enabled=false
