# 운영(k3s) 프로필. SPRING_PROFILES_ACTIVE=prod. 비밀 값은 모두 환경변수로 받는다 (NFR-06).
# 필요한 환경변수: DB_HOST·DB_PORT·DB_NAME·DB_USER·DB_PASSWORD, CRYPTO_KEY, HMAC_KEY,
#   (B0-3 로그인) JWT_SECRET·계정 초기 비밀번호, (웹 푸시) VAPID_PUBLIC_KEY·VAPID_PRIVATE_KEY
# 이 프로필에서는 임시 계정(X-Dev-Account-Id, DevAccountSeeder)이 꺼져 로그인(B0-3) 전에는 API가 401이다.

# API 명세는 운영에 내보내지 않는다 (/swagger-ui, /v3/api-docs)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# SQL과 바인딩 값은 로그에 남기지 않는다 (NFR-04b)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.mariadb.jdbc=WARN
