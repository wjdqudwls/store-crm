spring.application.name=backend

# 로컬 개발: 레포 맨 위의 .env를 읽는다. Gradle(backend/)과 IntelliJ(레포 루트) 어디서 실행해도 찾도록 두 곳을 본다.
# 실제 환경변수가 있으면 그 값이 우선이다. .env는 커밋하지 않는다 (NFR-06).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# DB (값은 환경변수로 받는다. 비밀번호는 기본값을 두지 않는다)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3316}/${DB_NAME:crm}
spring.datasource.username=${DB_USER:crm}
spring.datasource.password=${DB_PASSWORD}

# 테이블은 schema.sql로 직접 만들고, Hibernate는 엔티티와 맞는지 검사만 한다 (ADR-010)
# MariaDB 같은 외부 DB에서는 이 설정이 있어야 schema.sql이 실행된다 (기본값은 내장 DB에서만 실행).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
