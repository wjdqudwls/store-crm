spring.application.name=backend

# 로컬 개발: 레포 맨 위의 .env를 읽는다. Gradle(backend/)과 IntelliJ(레포 루트) 어디서 실행해도 찾도록 두 곳을 본다.
# 실제 환경변수가 있으면 그 값이 우선이다. .env는 커밋하지 않는다 (NFR-06).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# DB (값은 환경변수로 받는다. 비밀번호는 기본값을 두지 않는다)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3316}/${DB_NAME:crm}
spring.datasource.username=${DB_USER:crm}
spring.datasource.password=${DB_PASSWORD}

# DB 모양은 Flyway가 만든다 (db/migration/V*.sql, ADR-039). 적용한 파일은 고치지 않고 새 번호로 더한다.
# 이미 표가 있는 DB(로컬 데모)는 V1을 건너뛴 것으로 보고(baseline) V2부터 적용한다. Hibernate는 엔티티와 맞는지 검사만 한다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 개인정보 암호화 키 (NFR-04, NFR-06). 값은 환경변수로만 받고 기본값을 두지 않는다.
# 만드는 법: openssl rand -base64 32  (.env.example 참고)
crm.crypto.key=${CRYPTO_KEY}
crm.crypto.hmac-key=${HMAC_KEY}

# MyBatis: 목록·검색 조회 (ADR-018). SQL은 resources/mappers/{모듈}/ 에 두고 자기 모듈 테이블만 쓴다.
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 운영 점검: health만 연다. k3s 프로브(/actuator/health/liveness·readiness)는 쿠버네티스 밖에서도 켠다 (배포 세션 요청).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# 로그인 (B0-3, AUTH-01). JWT 시크릿은 32바이트 이상, 환경변수로만 받는다 (NFR-06). 만드는 법: openssl rand -base64 48
crm.jwt.secret=${JWT_SECRET}
# 기본 계정의 처음 비밀번호 (ADR-019). 환경변수로만 받는다. 8자 이상, 영문+숫자.
crm.accounts.hq-password=${HQ_INITIAL_PASSWORD}
crm.accounts.store-password=${STORE_INITIAL_PASSWORD}
crm.accounts.staff-password=${STAFF_INITIAL_PASSWORD}

# 웹 푸시 VAPID 키 (CAL-08, ADR-035). 없으면 푸시는 보내지 않고 알림함에만 쌓는다. 환경변수로만 받는다 (NFR-06).
crm.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
crm.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
# 방문 예약·재연락 알림을 매일 아침 9시(한국 시간)에 쌓는다 (CAL-12). 테스트는 끄고 직접 부른다.
crm.reminders.enabled=true

# 공개 등록(QR·키오스크, B1-4): QR에 담는 화면 주소의 앞부분(환경변수 PUBLIC_BASE_URL, 예: https://crm.example.com)과 IP당 분당 등록 한도 (NFR-04a)
crm.public.base-url=${PUBLIC_BASE_URL:http://localhost:8080}
crm.public.registration-limit=5
